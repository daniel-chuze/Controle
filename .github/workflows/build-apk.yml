name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Expo project
        run: |
          npx create-expo-app@latest app --template blank --yes
          cp App.js app/App.js
          cd app
          npx expo install expo-notifications @react-native-async-storage/async-storage
          node -e "const f=require('fs');const j=JSON.parse(f.readFileSync('app.json'));j.expo.name='Rotina';j.expo.android={...(j.expo.android||{}),package:'com.daniel.rotina'};j.expo.plugins=[...(j.expo.plugins||[]),'expo-notifications'];f.writeFileSync('app.json',JSON.stringify(j,null,2))"

      - name: Build Android release
        working-directory: app
        run: |
          npx expo prebuild --platform android
          cd android
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: rotina-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
